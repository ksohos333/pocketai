<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>PocketAI Companion — Settings</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <div class="wrap">
    <div class="head"><span class="brand">Settings</span></div>
    <p>Paste the access token from the PocketAI app (menu &#8942; &rarr; Access token).</p>
    <input id="token" type="text" placeholder="access token" style="width:100%;box-sizing:border-box;font-size:16px;padding:12px;border-radius:10px;border:1px solid #2a3244;background:#161b22;color:#e8eaed;outline:none">
    <label class="webtoggle"><input type="checkbox" id="webDefault"> enable web search by default</label>
    <p><button id="save" style="margin-top:14px;padding:10px 22px;border:none;border-radius:10px;background:#9ab0ff;color:#101418;font-size:15px;font-weight:600">Save</button>
    <span id="saved" style="margin-left:10px;color:#7a8697"></span></p>
    <div class="foot">The token never leaves this device. It is only sent to 127.0.0.1:8182.</div>
  </div>
  <script src="options.js"></script>
</body>
</html>
