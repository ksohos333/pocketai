<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PocketAI</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <div class="wrap">
    <div class="head">
      <span class="brand">PocketAI</span>
      <span class="badge" id="privacyBadge">on-device</span>
      <button id="del" class="delbtn" title="Delete chat">&#128465;</button>
      <a href="options.html" class="gear" title="Settings">&#9881;</a>
    </div>
    <form id="f">
      <input id="q" type="text" placeholder="Ask anything… (stays on this phone)" autocomplete="off" autofocus>
      <label class="webtoggle"><input type="checkbox" id="web"> web search</label>
      <label class="webtoggle"><input type="checkbox" id="keep"> keep history on this device</label>
    </form>
    <div id="status"></div>
    <div id="answer"></div>
    <div class="foot">local inference &#183; no telemetry &#183; nothing is stored unless &ldquo;keep history&rdquo; is on</div>
  </div>
  <script src="newtab.js"></script>
</body>
</html>
